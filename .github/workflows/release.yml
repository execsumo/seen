name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.1)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate the release on the same build+test job CI runs on every push, so a
  # broken suite fails before we touch signing secrets or a notarization slot.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
              echo "ERROR: tag v${VERSION} already exists"
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PWD="$(openssl rand -hex 16)"
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          rm -f cert.p12

      - name: Build and notarize DMG
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.apple
          echo "$APPLE_API_KEY" | base64 --decode > ~/.apple/AuthKey.p8
          ./scripts/dmg.sh \
            --sign "$APPLE_DEVELOPER_ID" \
            --api-key-path ~/.apple/AuthKey.p8 \
            --api-key-id "$APPLE_API_KEY_ID" \
            --api-issuer-id "$APPLE_API_ISSUER_ID" \
            --version "${{ steps.version.outputs.version }}" \
            --output dist
          rm -f ~/.apple/AuthKey.p8

      - name: Collect release metadata
        id: meta
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="dist/Seen-${VERSION}.dmg"
          SHA256=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "dmg=${DMG}" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.dmg }}
          generate_release_notes: true
          # Never swap out an asset the casks may already describe. A notarized,
          # stapled DMG is not byte-reproducible, so rebuilding an
          # already-published version yields a different sha256; replacing the
          # asset and then failing before the casks are updated leaves both of
          # them pointing at a hash that no longer exists anywhere -- which is
          # exactly how v0.1.4 broke `brew install`. With this false the action
          # skips an existing asset instead of deleting it, so whatever was
          # published first stays authoritative and a retry is idempotent.
          overwrite_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published asset checksum
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          # Hash what is actually published rather than what this run built.
          # With overwrite_files disabled the two differ whenever an earlier
          # attempt already uploaded this version, and it is the published
          # asset a `brew install` will fetch and verify.
          for attempt in 1 2 3; do
            rm -rf published && mkdir published
            if gh release download "v${VERSION}" \
                 --repo "$GITHUB_REPOSITORY" \
                 --pattern "Seen-${VERSION}.dmg" \
                 --dir published; then
              break
            fi
            echo "Published asset not readable yet (attempt ${attempt}); retrying."
            sleep $((attempt * 5))
          done
          PUBLISHED="published/Seen-${VERSION}.dmg"
          if [[ ! -f "$PUBLISHED" ]]; then
            echo "ERROR: could not download the published Seen-${VERSION}.dmg."
            exit 1
          fi
          SHA256=$(shasum -a 256 "$PUBLISHED" | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          if [[ "$SHA256" != "${{ steps.meta.outputs.sha256 }}" ]]; then
            echo "NOTE: the published asset is not the one this run built."
            echo "  built:     ${{ steps.meta.outputs.sha256 }}"
            echo "  published: ${SHA256}"
            echo "v${VERSION} was already released by an earlier attempt; its"
            echo "asset stands and the casks will describe it."
          fi

      - name: Commit and push cask update
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SHA256="${{ steps.published.outputs.sha256 }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://execsumo:${GH_PAT}@github.com/execsumo/seen.git"
          # checkout runs against the tag's commit, which is usually behind main
          # by the time we get here. Re-apply the edit onto whatever main is
          # *now*, on every attempt, so the commit is always a fast-forward --
          # a stale base is what produced the "fetch first" rejection. Retrying
          # the whole fetch/edit/commit closes the race with anything else
          # landing on main during the ~10 min build+notarize.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            sed -i '' \
              -e "s/version \"[^\"]*\"/version \"${VERSION}\"/" \
              -e "s/sha256 \"[^\"]*\"/sha256 \"${SHA256}\"/" \
              Casks/seen.rb
            git add Casks/seen.rb
            if git diff --cached --quiet; then
              echo "Cask already up to date on main; nothing to commit."
              exit 0
            fi
            # No [skip ci]: ci.yml's paths-ignore already excludes Casks/**, so
            # this sha-only commit costs no run. Dropping the blunt override
            # means a bot commit that ever touched code would still be gated.
            git commit -m "Update Homebrew cask to v${VERSION}"
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; refreshing main and retrying."
          done
          echo "ERROR: could not push the cask update after 3 attempts."
          exit 1

      - name: Push cask to Homebrew tap
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          git clone "https://execsumo:${GH_PAT}@github.com/execsumo/homebrew-tap.git" homebrew-tap
          mkdir -p homebrew-tap/Casks
          cp Casks/seen.rb homebrew-tap/Casks/seen.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/seen.rb
          if git diff --cached --quiet; then
            echo "Tap cask already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "Update seen to v${VERSION}"
          git push origin HEAD:refs/heads/main
